services:
  - type: web
    name: funnel-runtime-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: SQLITE_PATH
        value: /tmp/funnel.db
      - key: ADMIN_TOKEN
        generateValue: true
